name: SmartX Unsigned Build

on:
  pull_request:
    branches:
      - smartx

  push:
    tags:
      - "v*"
      - "*.*.*"

  release:
    types:
      - published

  workflow_dispatch:
    inputs:
      build_configuration:
        description: "Xcode build configuration"
        required: false
        default: "Release"
        type: choice
        options:
          - Debug
          - Release

env:
  FASTLANE_SKIP_UPDATE_CHECK: true
  XCODE_VERSION: "26.3"
  GO_VERSION: "1.21.x"
  RUBY_VERSION: "3.2"

jobs:
  pr-build:
    name: PR unsigned Debug build
    if: github.event_name == 'pull_request'
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Print toolchain
        run: |
          mkdir -p .ci-logs
          xcodebuild -version | tee .ci-logs/toolchain.log
          swift --version | tee -a .ci-logs/toolchain.log
          go version | tee -a .ci-logs/toolchain.log
          ruby --version | tee -a .ci-logs/toolchain.log
          bundle --version | tee -a .ci-logs/toolchain.log
          xcrun --sdk macosx --show-sdk-version | tee -a .ci-logs/toolchain.log

      - name: Install dependencies
        run: |
          set -o pipefail
          bash install_dependency.sh | tee .ci-logs/install-dependency.log

      - name: Resolve Swift Package dependencies
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -workspace ClashX.xcworkspace \
            -scheme ClashX \
            | tee .ci-logs/spm-resolve.log

      - name: Build unsigned Debug app
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ClashX.xcworkspace \
            -scheme ClashX \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            | tee .ci-logs/xcodebuild-debug.log

      - name: Collect PR artifacts
        if: always()
        run: |
          mkdir -p .ci-artifacts

          APP_PATH="$(find ~/Library/Developer/Xcode/DerivedData -path '*/Build/Products/Debug/SmartX.app' -type d | head -n 1 || true)"

          if [ -n "$APP_PATH" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" ".ci-artifacts/SmartX-PR-Debug.app.zip"
          else
            echo "SmartX.app was not found in DerivedData." | tee .ci-artifacts/NO_APP_FOUND.txt
          fi

          cp -R .ci-logs .ci-artifacts/logs

      - name: Upload PR artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartX-PR-Debug-${{ github.sha }}
          path: .ci-artifacts
          if-no-files-found: warn
          retention-days: 14

  unsigned-release-artifact:
    name: Unsigned release artifact
    if: >
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch'
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Print toolchain
        run: |
          mkdir -p .ci-logs
          xcodebuild -version | tee .ci-logs/toolchain.log
          swift --version | tee -a .ci-logs/toolchain.log
          go version | tee -a .ci-logs/toolchain.log
          ruby --version | tee -a .ci-logs/toolchain.log
          bundle --version | tee -a .ci-logs/toolchain.log
          node --version | tee -a .ci-logs/toolchain.log
          xcrun --sdk macosx --show-sdk-version | tee -a .ci-logs/toolchain.log

      - name: Install dependencies
        run: |
          set -o pipefail
          bash install_dependency.sh | tee .ci-logs/install-dependency.log

      - name: Resolve Swift Package dependencies
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -workspace ClashX.xcworkspace \
            -scheme ClashX \
            | tee .ci-logs/spm-resolve.log

      - name: Verify helper Release requirement is fail-closed
        run: |
          set -o pipefail
          xcodebuild \
            -project ClashX.xcodeproj \
            -target 'com.west2online.ClashX.ProxyConfigHelper' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -showBuildSettings \
            | tee .ci-logs/helper-release-build-settings.log
          python3 scripts/check_helper_requirement.py .ci-logs/helper-release-build-settings.log Release | tee .ci-logs/helper-release-check.log

      - name: Add build metadata
        run: |
          set -o pipefail
          cd ClashX
          python3 add_build_info.py | tee ../.ci-logs/add-build-info.log
          cd ..

      - name: Build unsigned app
        run: |
          set -o pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUILD_CONFIGURATION="${{ inputs.build_configuration }}"
          else
            BUILD_CONFIGURATION="Release"
          fi

          echo "Building unsigned ${BUILD_CONFIGURATION} app"

          xcodebuild \
            -workspace ClashX.xcworkspace \
            -scheme ClashX \
            -configuration "${BUILD_CONFIGURATION}" \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            | tee ".ci-logs/xcodebuild-${BUILD_CONFIGURATION}.log"

          echo "${BUILD_CONFIGURATION}" > .ci-logs/build-configuration.txt

      - name: Package unsigned app
        run: |
          set -euo pipefail

          BUILD_CONFIGURATION="$(cat .ci-logs/build-configuration.txt)"
          mkdir -p .ci-artifacts

          APP_PATH="$(find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/${BUILD_CONFIGURATION}/SmartX.app" -type d | head -n 1 || true)"

          if [ -z "$APP_PATH" ]; then
            echo "SmartX.app was not found in DerivedData for ${BUILD_CONFIGURATION}." | tee .ci-artifacts/NO_APP_FOUND.txt
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" ".ci-artifacts/SmartX-${BUILD_CONFIGURATION}-Unsigned.app.zip"

          cp -R .ci-logs .ci-artifacts/logs

      - name: Upload unsigned build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartX-${{ github.ref_name }}-${{ github.sha }}-Unsigned
          path: .ci-artifacts
          if-no-files-found: error
          retention-days: 30

