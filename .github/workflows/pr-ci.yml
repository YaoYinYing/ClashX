name: PR Unsigned Artifact Validation

on:
  pull_request:
  workflow_dispatch:

env:
  FASTLANE_SKIP_UPDATE_CHECK: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GO_VERSION: "1.21.x"
  RUBY_VERSION: "3.2"

jobs:
  validation-gate:
    name: PR Validation Gate
    runs-on: macos-15
    env:
      CI: true
      NSUnbufferedIO: YES
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ClashX/goClash/go.sum

      - name: Show available Xcodes
        run: |
          ls -1 /Applications | grep -E '^Xcode' || true
          xcodebuild -version || true

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Show toolchain versions
        run: |
          mkdir -p .ci-logs
          {
            echo "::group::xcodebuild -version"
            xcodebuild -version
            echo "::endgroup::"
            echo "::group::xcrun --sdk macosx --show-sdk-version"
            xcrun --sdk macosx --show-sdk-version
            echo "::endgroup::"
            echo "::group::swift --version"
            swift --version
            echo "::endgroup::"
            echo "::group::go version"
            go version
            echo "::endgroup::"
            echo "::group::ruby --version"
            ruby --version
            echo "::endgroup::"
            echo "::group::bundle --version"
            bundle --version
            echo "::endgroup::"
          } | tee .ci-logs/tool-versions.log

      - name: Install dependencies and resources
        run: |
          set -o pipefail
          {
            echo "::group::install_dependency.sh"
            bash install_dependency.sh
            echo "::endgroup::"
          } | tee .ci-logs/install-dependency.log

      - name: Resolve Swift package dependencies
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -workspace ClashX.xcworkspace \
            -scheme ClashX \
            | tee .ci-logs/spm-resolve.log

      - name: Verify helper Release requirement is fail-closed
        run: |
          set -o pipefail
          xcodebuild \
            -project ClashX.xcodeproj \
            -target 'com.west2online.ClashX.ProxyConfigHelper' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -showBuildSettings \
            | tee .ci-logs/helper-release-build-settings.log
          python3 scripts/check_helper_requirement.py .ci-logs/helper-release-build-settings.log Release | tee .ci-logs/helper-release-check.log

      - name: Security harness checks
        run: |
          set -o pipefail
          swift -module-cache-path /private/tmp/swift-module-cache \
            Tests/SecurityHarness/security_harness.swift \
            | tee .ci-logs/security-harness.log

      - name: Endpoint builder smoke harness
        run: |
          set -o pipefail
          swiftc -module-cache-path /private/tmp/swift-module-cache \
            ClashX/General/Utils/ControllerEndpointBuilder.swift \
            Tests/SecurityHarness/controller_endpoint_builder_smoke.swift \
            -o /tmp/controller-endpoint-builder-smoke
          /tmp/controller-endpoint-builder-smoke | tee .ci-logs/controller-endpoint-builder-smoke.log

      - name: Capability identity smoke harness
        run: |
          set -o pipefail
          swiftc -module-cache-path /private/tmp/swift-module-cache \
            ClashX/General/Utils/ControllerEndpointBuilder.swift \
            ClashX/General/Managers/CoreCapability.swift \
            Tests/SecurityHarness/capability_cache_identity_smoke.swift \
            -o /tmp/capability-cache-identity-smoke
          /tmp/capability-cache-identity-smoke | tee .ci-logs/capability-cache-identity-smoke.log

      - name: Config validator smoke harness
        run: |
          set -o pipefail
          swiftc -module-cache-path /private/tmp/swift-module-cache \
            ClashX/General/Utils/ConfigValidationIssue.swift \
            ClashX/General/Utils/TunConfigValidator.swift \
            ClashX/General/Utils/DNSConfigValidator.swift \
            Tests/SecurityHarness/config_validator_smoke.swift \
            -o /tmp/config-validator-smoke
          /tmp/config-validator-smoke | tee .ci-logs/config-validator-smoke.log

      - name: Diagnostics log reader smoke harness
        run: |
          set -o pipefail
          swiftc -module-cache-path /private/tmp/swift-module-cache \
            ClashX/General/Utils/SmartXRedactor.swift \
            ClashX/General/Utils/DiagnosticsLogReader.swift \
            Tests/SecurityHarness/diagnostics_log_reader_smoke.swift \
            -o /tmp/diagnostics-log-reader-smoke
          /tmp/diagnostics-log-reader-smoke | tee .ci-logs/diagnostics-log-reader-smoke.log

      - name: Diagnostics artifact formatter smoke harness
        run: |
          set -o pipefail
          swiftc -module-cache-path /private/tmp/swift-module-cache \
            ClashX/General/Utils/SmartXRedactor.swift \
            ClashX/General/Utils/DiagnosticsArtifactFormatter.swift \
            Tests/SecurityHarness/diagnostics_artifact_formatter_smoke.swift \
            -o /tmp/diagnostics-artifact-formatter-smoke
          /tmp/diagnostics-artifact-formatter-smoke | tee .ci-logs/diagnostics-artifact-formatter-smoke.log

      - name: Profile artifact metadata smoke harness
        run: |
          set -o pipefail
          swiftc -module-cache-path /private/tmp/swift-module-cache \
            ClashX/General/Managers/ProfileArtifactManager.swift \
            Tests/SecurityHarness/profile_artifact_metadata_smoke.swift \
            -o /tmp/profile-artifact-metadata-smoke
          /tmp/profile-artifact-metadata-smoke | tee .ci-logs/profile-artifact-metadata-smoke.log

      - name: SmartX managed override smoke harness
        run: |
          set -o pipefail
          swiftc -module-cache-path /private/tmp/swift-module-cache \
            ClashX/Models/SmartXManagedOverrideModel.swift \
            ClashX/General/Managers/SmartXManagedOverrideManager.swift \
            Tests/SecurityHarness/smartx_managed_override_smoke.swift \
            -o /tmp/smartx-managed-override-smoke
          /tmp/smartx-managed-override-smoke | tee .ci-logs/smartx-managed-override-smoke.log

      - name: Effective config generator smoke harness
        run: |
          set -o pipefail
          swiftc -module-cache-path /private/tmp/swift-module-cache \
            ClashX/Models/SmartXManagedOverrideModel.swift \
            ClashX/General/Managers/EffectiveConfigGenerator.swift \
            Tests/SecurityHarness/effective_config_generator_smoke.swift \
            -o /tmp/effective-config-generator-smoke
          /tmp/effective-config-generator-smoke | tee .ci-logs/effective-config-generator-smoke.log

      - name: Helper status smoke harness
        run: |
          set -o pipefail
          swiftc -module-cache-path /private/tmp/swift-module-cache \
            ClashX/Models/HelperStatus.swift \
            Tests/SecurityHarness/helper_status_smoke.swift \
            -o /tmp/helper-status-smoke
          /tmp/helper-status-smoke | tee .ci-logs/helper-status-smoke.log

      - name: Helper command contract smoke harness
        run: |
          set -o pipefail
          swiftc -module-cache-path /private/tmp/swift-module-cache \
            ClashX/Models/HelperCommandContract.swift \
            ClashX/General/Utils/HelperCommandRegistry.swift \
            Tests/SecurityHarness/helper_command_contract_smoke.swift \
            -o /tmp/helper-command-contract-smoke
          /tmp/helper-command-contract-smoke | tee .ci-logs/helper-command-contract-smoke.log

      - name: TUN lifecycle diagnostics smoke harness
        run: |
          set -o pipefail
          swiftc -module-cache-path /private/tmp/swift-module-cache \
            ClashX/General/Utils/ConfigValidationIssue.swift \
            ClashX/General/Utils/TunConfigValidator.swift \
            ClashX/General/Utils/DNSConfigValidator.swift \
            ClashX/Models/HelperStatus.swift \
            ClashX/Models/HelperCommandContract.swift \
            ClashX/General/Utils/HelperCommandRegistry.swift \
            ClashX/Models/TunLifecycleDiagnostics.swift \
            ClashX/General/Managers/TunPreflightPlanner.swift \
            Tests/SecurityHarness/tun_lifecycle_diagnostics_smoke.swift \
            -o /tmp/tun-lifecycle-diagnostics-smoke
          /tmp/tun-lifecycle-diagnostics-smoke | tee .ci-logs/tun-lifecycle-diagnostics-smoke.log

      - name: TUN runtime diagnostics smoke harness
        run: |
          set -o pipefail
          swiftc -module-cache-path /private/tmp/swift-module-cache \
            ClashX/General/Utils/ConfigValidationIssue.swift \
            ClashX/General/Utils/TunConfigValidator.swift \
            ClashX/General/Utils/DNSConfigValidator.swift \
            ClashX/Models/HelperStatus.swift \
            ClashX/Models/HelperCommandContract.swift \
            ClashX/General/Utils/HelperCommandRegistry.swift \
            ClashX/Models/TunLifecycleDiagnostics.swift \
            ClashX/General/Utils/TunRuntimeInterfaceProbe.swift \
            ClashX/General/Managers/TunPreflightPlanner.swift \
            Tests/SecurityHarness/tun_runtime_diagnostics_smoke.swift \
            -o /tmp/tun-runtime-diagnostics-smoke
          /tmp/tun-runtime-diagnostics-smoke | tee .ci-logs/tun-runtime-diagnostics-smoke.log

      - name: Redactor smoke harness
        run: |
          set -o pipefail
          swiftc -module-cache-path /private/tmp/swift-module-cache \
            ClashX/General/Utils/SmartXRedactor.swift \
            Tests/SecurityHarness/redactor_smoke.swift \
            -o /tmp/redactor-smoke
          /tmp/redactor-smoke | tee .ci-logs/redactor-smoke.log

      - name: Remote config decode smoke harness
        run: |
          set -o pipefail
          swiftc -module-cache-path /private/tmp/swift-module-cache \
            ClashX/Models/RemoteConfigModel.swift \
            Tests/SecurityHarness/remote_config_decode_smoke.swift \
            -o /tmp/remote-config-decode-smoke
          /tmp/remote-config-decode-smoke | tee .ci-logs/remote-config-decode-smoke.log

      - name: Upload validation logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: validation-logs-PR-${{ github.event.pull_request.number || 'manual' }}-${{ github.sha }}
          path: .ci-logs/**
          if-no-files-found: warn
          retention-days: 14

  pr-artifacts:
    name: ${{ matrix.display_name }}
    needs: validation-gate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The modern lane depends on GitHub-hosted macos-26 and an available Xcode 26.x image.
          # If 26.3 disappears, move to the nearest supported 26.x runner/Xcode pair instead of deleting this lane.
          - flavor: modern
            display_name: Modern Unsigned Debug Artifact
            runner: macos-26
            xcode: "26.3"
            deployment_target: "11.0"
            configuration: Debug
            artifact_suffix: Modern-Debug
    env:
      CI: true
      NSUnbufferedIO: YES
      BUILD_CONFIGURATION: ${{ matrix.configuration }}
      FLAVOR: ${{ matrix.flavor }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
      ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
      DERIVED_DATA_PATH: .derivedData-${{ matrix.flavor }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ClashX/goClash/go.sum

      - name: Show available Xcodes
        run: |
          ls -1 /Applications | grep -E '^Xcode' || true
          xcodebuild -version || true

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Show toolchain versions
        run: |
          mkdir -p .ci-logs
          {
            echo "::group::xcodebuild -version"
            xcodebuild -version
            echo "::endgroup::"
            echo "::group::xcrun --sdk macosx --show-sdk-version"
            xcrun --sdk macosx --show-sdk-version
            echo "::endgroup::"
            echo "::group::swift --version"
            swift --version
            echo "::endgroup::"
            echo "::group::go version"
            go version
            echo "::endgroup::"
            echo "::group::ruby --version"
            ruby --version
            echo "::endgroup::"
            echo "::group::bundle --version"
            bundle --version
            echo "::endgroup::"
          } | tee .ci-logs/tool-versions.log

      - name: Install dependencies and resources
        run: |
          set -o pipefail
          {
            echo "::group::install_dependency.sh"
            bash install_dependency.sh
            echo "::endgroup::"
          } | tee .ci-logs/install-dependency.log

      - name: Resolve Swift package dependencies
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -workspace ClashX.xcworkspace \
            -scheme ClashX \
            | tee .ci-logs/spm-resolve.log

      - name: Security harness checks
        run: |
          set -o pipefail
          swift Tests/SecurityHarness/security_harness.swift | tee .ci-logs/security-harness.log

      - name: Endpoint builder smoke harness
        run: |
          set -o pipefail
          swiftc -module-cache-path /private/tmp/swift-module-cache \
            ClashX/General/Utils/ControllerEndpointBuilder.swift \
            Tests/SecurityHarness/controller_endpoint_builder_smoke.swift \
            -o /tmp/controller-endpoint-builder-smoke
          /tmp/controller-endpoint-builder-smoke | tee .ci-logs/controller-endpoint-builder-smoke.log

      - name: Capability identity smoke harness
        run: |
          set -o pipefail
          swiftc -module-cache-path /private/tmp/swift-module-cache \
            ClashX/General/Utils/ControllerEndpointBuilder.swift \
            ClashX/General/Managers/CoreCapability.swift \
            Tests/SecurityHarness/capability_cache_identity_smoke.swift \
            -o /tmp/capability-cache-identity-smoke
          /tmp/capability-cache-identity-smoke | tee .ci-logs/capability-cache-identity-smoke.log

      - name: Config validator smoke harness
        run: |
          set -o pipefail
          swiftc -module-cache-path /private/tmp/swift-module-cache \
            ClashX/General/Utils/ConfigValidationIssue.swift \
            ClashX/General/Utils/TunConfigValidator.swift \
            ClashX/General/Utils/DNSConfigValidator.swift \
            Tests/SecurityHarness/config_validator_smoke.swift \
            -o /tmp/config-validator-smoke
          /tmp/config-validator-smoke | tee .ci-logs/config-validator-smoke.log

      - name: Diagnostics log reader smoke harness
        run: |
          set -o pipefail
          swiftc -module-cache-path /private/tmp/swift-module-cache \
            ClashX/General/Utils/SmartXRedactor.swift \
            ClashX/General/Utils/DiagnosticsLogReader.swift \
            Tests/SecurityHarness/diagnostics_log_reader_smoke.swift \
            -o /tmp/diagnostics-log-reader-smoke
          /tmp/diagnostics-log-reader-smoke | tee .ci-logs/diagnostics-log-reader-smoke.log

      - name: Diagnostics artifact formatter smoke harness
        run: |
          set -o pipefail
          swiftc -module-cache-path /private/tmp/swift-module-cache \
            ClashX/General/Utils/SmartXRedactor.swift \
            ClashX/General/Utils/DiagnosticsArtifactFormatter.swift \
            Tests/SecurityHarness/diagnostics_artifact_formatter_smoke.swift \
            -o /tmp/diagnostics-artifact-formatter-smoke
          /tmp/diagnostics-artifact-formatter-smoke | tee .ci-logs/diagnostics-artifact-formatter-smoke.log

      - name: Profile artifact metadata smoke harness
        run: |
          set -o pipefail
          swiftc -module-cache-path /private/tmp/swift-module-cache \
            ClashX/General/Managers/ProfileArtifactManager.swift \
            Tests/SecurityHarness/profile_artifact_metadata_smoke.swift \
            -o /tmp/profile-artifact-metadata-smoke
          /tmp/profile-artifact-metadata-smoke | tee .ci-logs/profile-artifact-metadata-smoke.log

      - name: SmartX managed override smoke harness
        run: |
          set -o pipefail
          swiftc -module-cache-path /private/tmp/swift-module-cache \
            ClashX/Models/SmartXManagedOverrideModel.swift \
            ClashX/General/Managers/SmartXManagedOverrideManager.swift \
            Tests/SecurityHarness/smartx_managed_override_smoke.swift \
            -o /tmp/smartx-managed-override-smoke
          /tmp/smartx-managed-override-smoke | tee .ci-logs/smartx-managed-override-smoke.log

      - name: Effective config generator smoke harness
        run: |
          set -o pipefail
          swiftc -module-cache-path /private/tmp/swift-module-cache \
            ClashX/Models/SmartXManagedOverrideModel.swift \
            ClashX/General/Managers/EffectiveConfigGenerator.swift \
            Tests/SecurityHarness/effective_config_generator_smoke.swift \
            -o /tmp/effective-config-generator-smoke
          /tmp/effective-config-generator-smoke | tee .ci-logs/effective-config-generator-smoke.log

      - name: Helper command contract smoke harness
        run: |
          set -o pipefail
          swiftc -module-cache-path /private/tmp/swift-module-cache \
            ClashX/Models/HelperCommandContract.swift \
            ClashX/General/Utils/HelperCommandRegistry.swift \
            Tests/SecurityHarness/helper_command_contract_smoke.swift \
            -o /tmp/helper-command-contract-smoke
          /tmp/helper-command-contract-smoke | tee .ci-logs/helper-command-contract-smoke.log

      - name: TUN lifecycle diagnostics smoke harness
        run: |
          set -o pipefail
          swiftc -module-cache-path /private/tmp/swift-module-cache \
            ClashX/General/Utils/ConfigValidationIssue.swift \
            ClashX/General/Utils/TunConfigValidator.swift \
            ClashX/General/Utils/DNSConfigValidator.swift \
            ClashX/Models/HelperStatus.swift \
            ClashX/Models/HelperCommandContract.swift \
            ClashX/General/Utils/HelperCommandRegistry.swift \
            ClashX/Models/TunLifecycleDiagnostics.swift \
            ClashX/General/Managers/TunPreflightPlanner.swift \
            Tests/SecurityHarness/tun_lifecycle_diagnostics_smoke.swift \
            -o /tmp/tun-lifecycle-diagnostics-smoke
          /tmp/tun-lifecycle-diagnostics-smoke | tee .ci-logs/tun-lifecycle-diagnostics-smoke.log

      - name: TUN runtime diagnostics smoke harness
        run: |
          set -o pipefail
          swiftc -module-cache-path /private/tmp/swift-module-cache \
            ClashX/General/Utils/ConfigValidationIssue.swift \
            ClashX/General/Utils/TunConfigValidator.swift \
            ClashX/General/Utils/DNSConfigValidator.swift \
            ClashX/Models/HelperStatus.swift \
            ClashX/Models/HelperCommandContract.swift \
            ClashX/General/Utils/HelperCommandRegistry.swift \
            ClashX/Models/TunLifecycleDiagnostics.swift \
            ClashX/General/Utils/TunRuntimeInterfaceProbe.swift \
            ClashX/General/Managers/TunPreflightPlanner.swift \
            Tests/SecurityHarness/tun_runtime_diagnostics_smoke.swift \
            -o /tmp/tun-runtime-diagnostics-smoke
          /tmp/tun-runtime-diagnostics-smoke | tee .ci-logs/tun-runtime-diagnostics-smoke.log

      - name: Build unsigned Debug app
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ClashX.xcworkspace \
            -scheme ClashX \
            -configuration "${BUILD_CONFIGURATION}" \
            -destination 'platform=macOS' \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            MACOSX_DEPLOYMENT_TARGET="${MACOSX_DEPLOYMENT_TARGET}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee .ci-logs/xcodebuild-build.log

      - name: Package unsigned app artifact
        run: |
          set -euo pipefail
          mkdir -p .ci-artifacts

          APP_PATH="${DERIVED_DATA_PATH}/Build/Products/${BUILD_CONFIGURATION}/SmartX.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "SmartX.app was not found at $APP_PATH" | tee .ci-artifacts/NO_APP_FOUND.txt
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" ".ci-artifacts/SmartX-${ARTIFACT_SUFFIX}-${GITHUB_SHA}.app.zip"
          cp -R .ci-logs .ci-artifacts/logs

      - name: Upload unsigned PR artifacts for manual testing
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: SmartX-${{ matrix.artifact_suffix }}-PR-${{ github.event.pull_request.number || 'manual' }}-${{ github.sha }}
          path: |
            .ci-artifacts/**
            .ci-logs/**
            ${{ env.DERIVED_DATA_PATH }}/Logs/**
          if-no-files-found: error
          retention-days: 14
