name: PR Unsigned Artifact Validation

on:
  pull_request:
  workflow_dispatch:

env:
  FASTLANE_SKIP_UPDATE_CHECK: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GO_VERSION: "1.21.x"
  RUBY_VERSION: "3.2"

jobs:
  validation-gate:
    name: PR Validation Gate
    runs-on: macos-15
    env:
      CI: true
      NSUnbufferedIO: YES
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ClashX/goClash/go.sum

      - name: Show available Xcodes
        run: |
          ls -1 /Applications | grep -E '^Xcode' || true
          xcodebuild -version || true

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Show toolchain versions
        run: |
          mkdir -p .ci-logs
          { xcodebuild -version; xcrun --sdk macosx --show-sdk-version; swift --version; go version; ruby --version; bundle --version; } | tee .ci-logs/tool-versions.log

      - name: Install dependencies and resources
        run: bash install_dependency.sh | tee .ci-logs/install-dependency.log

      - name: Resolve Swift package dependencies
        run: xcodebuild -resolvePackageDependencies -workspace ClashX.xcworkspace -scheme ClashX | tee .ci-logs/spm-resolve.log

      - name: Verify Go module integrity
        run: |
          cd ClashX/goClash
          go mod verify | tee ../../.ci-logs/go-mod-verify.log
          grep -q 'replace github.com/metacubex/mihomo' go.mod || { echo "ERROR: missing replace directive"; exit 1; }
          grep -q "go 1.21" go.mod || { echo "ERROR: go.mod Go version mismatch"; exit 1; }
          cd ../..

      - name: Verify helper Release requirement is fail-closed
        run: |
          xcodebuild -project ClashX.xcodeproj -target 'com.west2online.ClashX.ProxyConfigHelper' -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -showBuildSettings | tee .ci-logs/helper-release-build-settings.log
          python3 scripts/check_helper_requirement.py .ci-logs/helper-release-build-settings.log Release | tee .ci-logs/helper-release-check.log

      - name: Run all tests (smoke harnesses + XCTests)
        run: bash scripts/codex-test-focused.sh

      - name: Upload validation logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: validation-logs-PR-${{ github.event.pull_request.number || 'manual' }}-${{ github.sha }}
          path: .ci-logs/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  pr-artifacts:
    name: ${{ matrix.display_name }}
    needs: validation-gate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: modern
            display_name: Modern Unsigned Debug Artifact
            runner: macos-26
            xcode: "26.3"
            deployment_target: "11.0"
            configuration: Debug
            artifact_suffix: Modern-Debug
    env:
      CI: true
      NSUnbufferedIO: YES
      BUILD_CONFIGURATION: ${{ matrix.configuration }}
      FLAVOR: ${{ matrix.flavor }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
      ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
      DERIVED_DATA_PATH: .derivedData-${{ matrix.flavor }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ClashX/goClash/go.sum

      - name: Show available Xcodes
        run: |
          ls -1 /Applications | grep -E '^Xcode' || true
          xcodebuild -version || true

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Show toolchain versions
        run: |
          mkdir -p .ci-logs
          { xcodebuild -version; xcrun --sdk macosx --show-sdk-version; swift --version; go version; ruby --version; bundle --version; } | tee .ci-logs/tool-versions.log

      - name: Install dependencies and resources
        run: bash install_dependency.sh | tee .ci-logs/install-dependency.log

      - name: Resolve Swift package dependencies
        run: xcodebuild -resolvePackageDependencies -workspace ClashX.xcworkspace -scheme ClashX | tee .ci-logs/spm-resolve.log

      - name: Verify Go module integrity
        run: |
          cd ClashX/goClash
          go mod verify | tee ../../.ci-logs/go-mod-verify.log
          grep -q 'replace github.com/metacubex/mihomo' go.mod || { echo "ERROR: missing replace directive"; exit 1; }
          cd ../..

      - name: Run all tests (smoke harnesses + XCTests)
        run: bash scripts/codex-test-focused.sh

      - name: Build unsigned Debug app
        run: |
          xcodebuild -workspace ClashX.xcworkspace -scheme ClashX -configuration "${BUILD_CONFIGURATION}" -destination 'platform=macOS' -derivedDataPath "${DERIVED_DATA_PATH}" MACOSX_DEPLOYMENT_TARGET="${MACOSX_DEPLOYMENT_TARGET}" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tee .ci-logs/xcodebuild-build.log

      - name: Verify helper binary embedded plist
        run: |
          HELPER_PATH="${DERIVED_DATA_PATH}/Build/Products/${BUILD_CONFIGURATION}/com.west2online.ClashX.ProxyConfigHelper"
          if [ ! -f "$HELPER_PATH" ]; then echo "Helper binary not found — skipping plist check"; exit 0; fi
          EMBEDDED=$(plutil -p "${HELPER_PATH}/Contents/Info.plist" 2>/dev/null || echo "")
          if [ -z "$EMBEDDED" ]; then echo "WARNING: could not extract embedded plist"; exit 0; fi
          echo "$EMBEDDED" | tee .ci-logs/helper-embedded-plist.log
          echo "$EMBEDDED" | grep -q "AllowedClientCodeSigningRequirement" || { echo "ERROR: helper binary missing AllowedClientCodeSigningRequirement"; exit 1; }

      - name: Package unsigned app artifact
        run: |
          mkdir -p .ci-artifacts
          APP_PATH="${DERIVED_DATA_PATH}/Build/Products/${BUILD_CONFIGURATION}/SmartX.app"
          if [ ! -d "$APP_PATH" ]; then echo "SmartX.app was not found at $APP_PATH" | tee .ci-artifacts/NO_APP_FOUND.txt; exit 1; fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" ".ci-artifacts/SmartX-${ARTIFACT_SUFFIX}-${GITHUB_SHA}.app.zip"
          cp -R .ci-logs .ci-artifacts/logs

      - name: Upload unsigned PR artifacts for manual testing
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: SmartX-${{ matrix.artifact_suffix }}-PR-${{ github.event.pull_request.number || 'manual' }}-${{ github.sha }}
          path: |
            .ci-artifacts/**
            .ci-logs/**
            ${{ env.DERIVED_DATA_PATH }}/Logs/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
